name: web-publish
on:
  push: { paths: ["web/**"] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: Rscript -e 'install.packages(c("knitr","rmarkdown"), repos="https://packagemanager.posit.co/cran/__linux__/noble/latest")'
      - run: quarto add r-wasm/quarto-live --no-prompt
        working-directory: web
      - run: quarto render ch10_web.qmd --to live-html
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - uses: actions/deploy-pages@v4
