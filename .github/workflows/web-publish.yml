name: web-publish
on:
  push: { paths: ["web/**"] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: Rscript -e 'install.packages(c("knitr","rmarkdown","dplyr","kableExtra","flextable","officer","readr","ggplot2","tidyr","stringr","tibble","broom","car","patchwork","scales","sandwich","yaml","gt","pROC"), repos="https://packagemanager.posit.co/cran/__linux__/noble/latest")'
      - run: quarto add r-wasm/quarto-live --no-prompt
        working-directory: web
      - run: |
          for f in index 01_web 02_web 03_web 04_web 05_web 06_web 07_web 08_web 09_web ch10_web 11_web 12_web 13_web; do
            quarto render "${f}.qmd" --to live-html
          done
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - uses: actions/deploy-pages@v4
